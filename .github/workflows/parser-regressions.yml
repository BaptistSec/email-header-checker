name: Parser regressions
on:
  push:
    paths:
      - header-check.js
      - test.js
      - .github/workflows/parser-regressions.yml
  pull_request:
    paths:
      - header-check.js
      - test.js
      - .github/workflows/parser-regressions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run shared parser regressions
        run: node test.js
