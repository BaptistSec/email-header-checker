name: Parser regressions
on:
  push:
    paths:
      - header-check.js
      - test.js
      - .github/workflows/parser-regressions.yml
  pull_request:
    paths:
      - header-check.js
      - test.js
      - .github/workflows/parser-regressions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run shared parser regressions
        run: node test.js
